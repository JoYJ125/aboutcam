<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AboutCam 회원가입</title><style>body{font:16px sans-serif;background:#161b2d;color:white;display:grid;place-items:center;min-height:100vh;margin:0}form{background:#292f43;padding:28px;border-radius:14px;width:min(90vw,420px)}input,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:12px 0;border-radius:8px;border:0}button{background:#3c9d6e;color:white;font-weight:bold}a{color:#a5d7ff}.error{color:#ffaaa9}small{color:#ccc}</style></head><body><form method="post"><h2>🏠 AboutCam 회원가입</h2><input name="username" autocomplete="username" minlength="3" maxlength="32" placeholder="아이디 (영문/숫자/_/-)" required><input name="password" type="password" autocomplete="new-password" minlength="12" placeholder="비밀번호 (12자 이상)" required><input name="invite_code" type="password" placeholder="관리자 초대 코드" required><input name="webhook" type="url" placeholder="https://discord.com/api/webhooks/..." required><small>Discord 채널 설정 → 연동 → 웹후크에서 생성한 URL을 입력하세요. URL은 암호화해 저장하며 다른 사용자에게 표시하지 않습니다.</small><button type="submit">회원가입 및 Discord 연동</button>{% if error %}<p class="error">{{ error }}</p>{% endif %}<p><a href="/login">로그인으로 돌아가기</a></p></form></body></html>
