<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AboutCam 관리자 설정</title><style>body{font-family:system-ui,sans-serif;background:#f4f6f9;padding:20px;color:#172033}main{max-width:650px;margin:auto;background:white;border-radius:14px;padding:26px}section{border-top:1px solid #ddd;margin-top:28px;padding-top:18px}label{display:block;margin:12px 0}input,select{display:block;box-sizing:border-box;width:100%;padding:10px;margin-top:5px}button{background:#164f9e;color:white;border:0;padding:12px;border-radius:6px}.danger{background:#a21d1d}.error{color:#a21d1d}</style></head><body><main><p><a href="/">← 대시보드</a></p><h1>관리자 설정</h1><p>IP 접근 관리는 별도 페이지에서 수행합니다. 아래 작업은 IP 관리 전용 인증 정보가 매번 필요합니다.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<section><h2>IP 관리 전용 인증 정보 변경</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="action" value="change_admin"><label>현재 전용 아이디<input name="admin_username" required></label><label>현재 전용 비밀번호<input type="password" name="admin_password" required></label><label>새 전용 아이디<input name="new_username" required></label><label>새 전용 비밀번호 (16자 이상)<input type="password" name="new_password" minlength="16" required></label><button>인증 정보 변경</button></form></section><section><h2>관리자 권한 양도</h2><p>새 관리자에게 CCTV 관리자 권한을 양도합니다. 양도 후 로그아웃됩니다. IP 관리 전용 인증 정보는 자동 변경되지 않으므로 별도 인계 또는 재설정이 필요합니다.</p><form method="post" onsubmit="return confirm('관리자 권한을 양도하시겠습니까?')"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="action" value="transfer"><label>새 관리자<select name="username" required>{% for user in users %}<option value="{{ user.username }}">{{ user.username }}</option>{% endfor %}</select></label><label>현재 CCTV 계정 비밀번호<input type="password" name="account_password" required></label><label>IP 관리 전용 아이디<input name="admin_username" required></label><label>IP 관리 전용 비밀번호<input type="password" name="admin_password" required></label><label>확인 문구 TRANSFER<input name="confirm" required></label><button class="danger" {% if not users %}disabled{% endif %}>관리자 권한 양도</button></form></section><section><h2>IP 관리 전용 인증 정보 삭제</h2><p>삭제 후 IP 관리는 잠기며 서버 복구 코드로 재설정해야 합니다.</p><form method="post" onsubmit="return confirm('IP 관리 전용 인증 정보를 삭제할까요?')"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="action" value="delete_admin"><label>전용 아이디<input name="admin_username" required></label><label>전용 비밀번호<input type="password" name="admin_password" required></label><label>서버 복구 코드<input type="password" name="recovery_code" required></label><button class="danger">전용 인증 정보 삭제</button></form></section></main></body></html>
