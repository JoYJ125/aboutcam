<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP 관리자 인증 정보 설정</title><style>body{font-family:system-ui,sans-serif;background:#f4f6f9;padding:25px}main{max-width:470px;margin:auto;background:#fff;border-radius:14px;padding:28px}label{display:block;margin:16px 0}input{display:block;box-sizing:border-box;width:100%;padding:11px;margin-top:6px}button{padding:12px;background:#1759aa;color:#fff;border:0;border-radius:7px}.error{color:#a21d1d}</style></head><body><main><p><a href="/admin-settings">← 관리자 설정</a></p><h1>IP 관리 인증 정보 설정·복구</h1><p>이 화면은 일반 IP 관리 로그인과 분리되어 있습니다. 현재 CCTV 관리자 계정과 서버 복구 코드가 필요합니다.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="action" value="{{ 'recover_admin' if configured else 'provision_admin' }}"><label>CCTV 관리자 아이디<input name="account_username" required></label><label>CCTV 관리자 비밀번호<input type="password" name="account_password" required></label><label>새 IP 관리 전용 아이디<input name="admin_username" required></label><label>새 IP 관리 전용 비밀번호 (16자 이상)<input type="password" name="admin_password" minlength="16" required></label><label>서버 복구 코드<input type="password" name="recovery_code" required></label><button type="submit">{{ '인증 정보 복구·재설정' if configured else '최초 관리자 생성' }}</button></form></main></body></html>
