<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AboutCam IP 관리 로그인</title><style>body{font-family:system-ui,sans-serif;background:#f4f6f9;padding:25px}.card{max-width:420px;margin:45px auto;background:#fff;border-radius:14px;padding:28px;box-shadow:0 4px 18px #0001}label{display:block;margin:16px 0}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #cbd5e1;border-radius:7px}button{padding:12px 20px;background:#1759aa;color:white;border:0;border-radius:7px;width:100%;cursor:pointer}.error{color:#a21d1d}</style></head><body><main class="card"><p><a href="/">← 대시보드</a></p><h1>IP 관리 관리자 로그인</h1><p>IP 관리 전용 관리자 아이디와 비밀번호를 입력하세요.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/ip-management"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="action" value="authenticate"><label>관리자 아이디<input name="admin_username" required autocomplete="username" autofocus></label><label>관리자 비밀번호<input type="password" name="admin_password" required autocomplete="current-password"></label><button type="submit">관리자 로그인</button></form></main></body></html>
