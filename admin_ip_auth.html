<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 재인증</title><style>body{font-family:system-ui,sans-serif;background:#f4f6f9;padding:30px}.card{max-width:440px;margin:40px auto;background:white;border-radius:14px;padding:28px}label{display:block;margin:18px 0}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin-top:6px}button{padding:12px 20px;background:#1759aa;color:white;border:0;border-radius:7px}.error{color:#a21d1d}</style></head><body><main class="card"><p><a href="/">← 대시보드</a></p><h1>IP 접근 관리 인증</h1><p>관리자 아이디와 비밀번호를 다시 입력해 주세요.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/ip-management"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="action" value="authenticate"><label>관리자 아이디<input name="admin_username" required autocomplete="username"></label><label>관리자 비밀번호<input type="password" name="admin_password" required autocomplete="current-password"></label><button type="submit">인증 후 관리</button></form></main></body></html>
