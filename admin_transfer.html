<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 권한 양도</title><style>body{font-family:system-ui,sans-serif;background:#f4f6f9;padding:30px}.card{max-width:500px;background:white;margin:auto;padding:28px;border-radius:14px}label{display:block;margin:16px 0}input,select{display:block;width:100%;padding:10px;box-sizing:border-box;margin-top:6px}button{padding:12px;background:#a21d1d;color:white;border:0;border-radius:7px}.error{color:#a21d1d}</style></head><body><main class="card"><p><a href="/ip-management">← IP 관리</a></p><h1>관리자 권한 양도</h1><p>양도 즉시 현재 계정은 일반 사용자로 변경되고, 선택한 계정만 관리자가 됩니다. 진행 후 다시 로그인해야 합니다.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>새 관리자 계정<select name="username" required>{% for user in users %}<option value="{{ user.username }}">{{ user.username }}</option>{% endfor %}</select></label><label>현재 관리자 비밀번호<input type="password" name="password" required autocomplete="current-password"></label><label>확인 문구: TRANSFER<input name="confirm" required autocomplete="off" placeholder="TRANSFER"></label><button type="submit" {% if not users %}disabled{% endif %}>관리자 권한 양도</button></form></main></body></html>
