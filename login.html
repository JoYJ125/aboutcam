<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AboutCam 로그인</title><style>body{font:16px sans-serif;background:#161b2d;color:white;display:grid;place-items:center;min-height:100vh;margin:0}form{background:#292f43;padding:28px;border-radius:14px;width:min(90vw,360px)}input,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin:12px 0;border-radius:8px;border:0}button{background:#3c9d6e;color:white;font-weight:bold}a{color:#a5d7ff}.error{color:#ffaaa9}</style></head><body><form method="post"><h2>🏠 AboutCam 로그인</h2><input name="username" autocomplete="username" placeholder="아이디" required><input name="password" type="password" autocomplete="current-password" placeholder="비밀번호" required><button type="submit">로그인</button>{% if error %}<p class="error">{{ error }}</p>{% endif %}<p>계정이 없나요? <a href="/register">회원가입</a></p></form></body></html>
