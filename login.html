<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 홈 CCTV</title>
    <style>
        body { font-family: sans-serif; background: #1e1e2f; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        form { background: #2b2b40; padding: 30px; border-radius: 12px; width: 280px; text-align: center; }
        input, button { width: 100%; padding: 12px; margin-top: 12px; border: none; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { background: #4caf50; color: #fff; cursor: pointer; }
        .error { color: #ff6b6b; margin-top: 12px; }
    </style>
</head>
<body>
    <form method="POST">
        <h2>🏠 홈 CCTV</h2>
        <input type="password" name="password" placeholder="비밀번호" autofocus required>
        <button type="submit">로그인</button>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
</body>
</html>
